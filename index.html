async function exportAssetHistory(assetId,asPdf=false){let a=S.assets.find(x=>x.id===assetId),rows=await rpc('nx_export_asset_history',{p_asset_id:assetId,p_from:new Date(Date.now()-365*86400000).toISOString(),p_to:new Date(Date.now()+86400000).toISOString()});let code=(a?.code||'machine').replace(/[^a-zA-Z0-9_-]/g,'_');asPdf?printReport('Historique machine '+(a?.code||''),rows):downloadCsv('mainteno_historique_'+code+'.csv',rows)}
function dashboard(){let k=S.kpi||{},healthOk=S.health?.overall_ok;shell(`<div class="row mobileStack"><div><h1 class="title">Dashboard</h1><p class="sub">Vue Responsable</p></div>${healthOk===false?'<button class="btn danger" data-p="diagnostic">Diagnostic requis</button>':healthOk===true?'<button class="btn success" data-p="diagnostic">Système OK</button>':''}</div><div class="kpis"><div class="kpi"><b>${k.open_work_orders??S.wo.filter(w=>!['completed','validated','cancelled'].includes(w.status)).length}</b><span>OT OUVERTS</span></div><div class="kpi"><b>${S.wo.filter(w=>w.status==='completed').length}</b><span>À VALIDER</span></div><div class="kpi"><b>${S.assets.filter(a=>a.status==='offline').length}</b><span>MACHINES ARRÊTÉES</span></div><div class="kpi"><b>${S.parts.filter(p=>Number(p.quantity_on_hand)<=Number(p.minimum_stock)).length}</b><span>STOCK BAS</span></div></div><div class="grid2"><div class="card"><h3>OT à valider</h3>${S.wo.filter(w=>w.status==='completed').slice(0,8).map(woRow).join('')||'<div class="mut">Aucun.</div>'}</div><div class="card"><h3>Préventif à venir</h3>${S.pm.slice(0,8).map(p=>`<div class="listitem"><b>${e(p.name)}</b><div class="mut">${p.next_due_at?new Date(p.next_due_at).toLocaleString('fr-FR'):'Déclenchement compteur'}</div></div>`).join('')||'<div class="mut">Aucun.</div>'}</div></div>`)}
function assets(){shell(`<div class="row mobileStack"><div><h1 class="title">Parc machines</h1><p class="sub">Actifs et historique</p></div><button class="btn primary" data-a="scan">⌗ Scanner</button></div><div class="grid2">${S.assets.map(a=>`<div class="card" data-asset="${a.id}"><div class="row"><div><b>${e(a.code)} · ${e(a.name)}</b><div class="mut">${e(a.manufacturer||'—')} ${e(a.model||'')}</div></div>${pill(a.status)}</div><div class="stack" style="margin-top:8px"><span class="pill">${e(a.criticality)}</span><span class="pill">${e(a.maintenance_strategy||'—')}</span></div></div>`).join('')||'<div class="mut">Aucune machine.</div>'}</div>`)}

function assetDetail(){let a=S.assets.find(x=>x.id===S.selected);if(!a){S.page='assets';return render()}let hist=S.wo.filter(w=>w.asset_id===a.id);shell(`<button class="btn" data-p="assets">← Machines</button><div class="card"><div class="row mobileStack"><div><div class="mut">${e(a.code)}</div><h1 class="title">${e(a.name)}</h1><p class="sub">${e(a.manufacturer||'—')} ${e(a.model||'')}</p></div><div class="stack">${pill(a.status)}<button class="btn" data-a="assetqr">▦ QR / Imprimer</button><button class="btn primary" data-a="createwo">+ Créer OT</button></div></div>${metric('Criticité',a.criticality)}${metric('Département',a.department||'—')}${metric('Ligne',a.production_line||'—')}${metric('Emplacement texte',a.exact_location||'—')}${metric('Emplacement GMAO',(S.locations.find(l=>l.id===a.location_id)?.path)||'—')}${isMgr()?'<div style="margin-top:10px"><button class="btn" data-a="assignassetlocation">Affecter emplacement</button></div>':''}</div><div class="card"><div class="row"><h3>Historique maintenance</h3>${isMgr()?'<div class="stack"><button class="btn" data-a="exportasset">Excel</button><button class="btn" data-a="printasset">PDF</button></div>':''}</div>${hist.slice(0,12).map(woRow).join('')||'<div class="mut">Aucun OT.</div>'}</div>`)}
function workorders(){let arr=isMgr()?S.wo:S.wo.filter(w=>w.technician_id===S.u.id);shell(`<div class="row mobileStack"><div><h1 class="title">${isMgr()?'Ordres de travail':'Mes OT'}</h1><p class="sub">Synchronisation terrain</p></div><div class="stack">${isMgr()?'<button class="btn primary" data-a="newwo">+ Nouvel OT</button>':''}<button class="btn primary" data-a="scan">⌗ Scanner</button>${isMgr()?'<button class="btn" data-a="exportwo">Excel</button><button class="btn" data-a="printwo">PDF</button>':''}</div></div><div class="card">${arr.map(woRow).join('')||'<div class="mut">Aucun OT.</div>'}</div>`)}


function qrBox(id,title,url,note=''){return `<div class="card qrLabel"><h3>${e(title)}</h3><div id="${id}" class="qrCanvas"></div><div class="qrUrl">${e(url)}</div>${note?`<div class="mut">${e(note)}</div>`:''}</div>`}
function drawQr(id,text){let el=document.getElementById(id);if(!el)return;el.innerHTML='';if(typeof QRCode==='undefined'){el.innerHTML='<div class="notice bad">Générateur QR indisponible. Reconnecte le téléphone puis rouvre cette page.</div>';return}new QRCode(el,{text,width:260,height:260,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
function assetQr(){let a=S.assets.find(x=>x.id===S.selected);if(!a){S.page='assets';return render()}let portal=S.portals.find(p=>p.asset_id===a.id&&p.active!==false),internal=location.origin+'/#/asset/'+a.id,publicUrl=portal?location.origin+'/#/request/'+portal.token:null;shell(`<button class="btn noPrint" data-p="assetDetail">← Machine</button><div class="row mobileStack noPrint" style="margin:12px 0"><div><h1 class="title">QR · ${e(a.code)}</h1><p class="sub">${e(a.name)} · imprimer et fixer sur la machine</p></div><div class="stack"><button class="btn primary" data-a="printqr">Imprimer</button><button class="btn" data-a="copyassetqr">Copier lien machine</button>${publicUrl?'<button class="btn" data-a="copyrequestqr">Copier lien demande</button>':isMgr()?'<button class="btn primary" data-a="createassetportal">Créer QR demande opérateur</button>':''}</div></div><div class="qrPrint"><div class="qrHead"><b>Mainteno · ${e(a.code)}</b><span>${e(a.name)}</span></div><div class="grid2">${qrBox('assetQrInternal','Équipe maintenance',internal,'Ouvre directement la fiche machine après connexion')}${publicUrl?qrBox('assetQrRequest','Demande opérateur',publicUrl,'Aucun compte requis'):isMgr()?'<div class="card"><h3>Demande opérateur</h3><p class="mut">Aucun portail public n’est encore associé à cette machine.</p><button class="btn primary noPrint" data-a="createassetportal">Créer le portail</button></div>':''}</div></div>`);setTimeout(()=>{drawQr('assetQrInternal',internal);if(publicUrl)drawQr('assetQrRequest',publicUrl)},0)}


function newwo(){if(!isMgr()){S.page='workorders';return render()}let assetId=S.newWoAsset||'',asset=S.assets.find(a=>a.id===assetId);shell(`<button class="btn" data-p="workorders">← OT</button><div class="row mobileStack" style="margin:12px 0"><div><h1 class="title">Créer un ordre de travail</h1><p class="sub">Création manuelle ou à partir d’un modèle</p></div></div><form id="newWO"><div class="card"><div class="field"><label>Modèle OT</label><select name="template_id" id="woTemplate"><option value="">Aucun — création manuelle</option>${S.templates.map(t=>`<option value="${t.id}">${e(t.name)} · ${e(t.work_order_type)} · ${e(t.priority)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Machine</label><select name="asset_id" id="woAsset"><option value="">Sans machine</option>${S.assets.map(a=>`<option value="${a.id}" ${a.id===assetId?'selected':''}>${e(a.code)} · ${e(a.name)}</option>`).join('')}</select></div><div class="field"><label>Échéance</label><input name="due_at" type="datetime-local"></div></div><div class="field"><label>Titre *</label><input name="title" id="woTitle" required value="${e(asset?'Intervention sur '+asset.name:'')}"></div><div class="field"><label>Description</label><textarea name="description" id="woDescription"></textarea></div><div class="grid3"><div class="field"><label>Type</label><select name="type" id="woType"><option value="corrective">Correctif</option><option value="preventive">Préventif</option><option value="inspection">Inspection</option><option value="improvement">Amélioration</option><option value="emergency">Urgence</option></select></div><div class="field"><label>Priorité</label><select name="priority" id="woPriority"><option value="low">Basse</option><option value="medium" selected>Moyenne</option><option value="high">Haute</option><option value="urgent">Urgente</option></select></div><div class="field"><label>Durée estimée (min)</label><input name="estimated_minutes" id="woEstimated" type="number" min="0" step="1"></div></div><div class="grid2"><div class="field"><label>Équipe</label><select name="team_id" id="woTeam"><option value="">Aucune</option>${S.teams.map(t=>`<option value="${t.id}">${e(t.name)}</option>`).join('')}</select></div><div class="field"><label>Technicien</label><select name="technician_id" id="woTechnician"><option value="">Aucun</option>${S.profiles.filter(p=>['technician','supervisor','manager','admin'].includes(p.role)).map(p=>`<option value="${p.id}">${e(p.full_name)} · ${e(p.role)}</option>`).join('')}</select></div></div><div class="field"><label>Catégorie</label><input name="category" id="woCategory" placeholder="Mécanique, électrique, sécurité…"></div><div class="stack"><label><input type="checkbox" name="photos_before_required" id="woBefore"> Photo avant obligatoire</label><label><input type="checkbox" name="photos_after_required" id="woAfter"> Photo après obligatoire</label><label><input type="checkbox" name="signature_required" id="woSignature"> Signature obligatoire</label></div></div><div class="row"><button type="button" class="btn" data-p="workorders">Annuler</button><button class="btn primary" type="submit">Créer l’OT</button></div></form>`);setTimeout(bindWoTemplate,0)}
function woTechOptions(teamId,selected=''){let allowed=teamId?S.teamMembers.filter(m=>m.team_id===teamId).map(m=>m.user_id):null;return '<option value="">Aucun</option>'+S.profiles.filter(p=>['technician','supervisor','manager','admin'].includes(p.role)&&(!allowed||allowed.includes(p.id))).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${e(p.full_name)} · ${e(p.role)}</option>`).join('')}
function refreshWoTechnicians(selected=''){let team=document.getElementById('woTeam'),tech=document.getElementById('woTechnician');if(!team||!tech)return;tech.innerHTML=woTechOptions(team.value,selected)}
function bindWoTemplate(){let sel=document.getElementById('woTemplate'),team=document.getElementById('woTeam');if(!sel)return;if(team)team.addEventListener('change',()=>refreshWoTechnicians());sel.addEventListener('change',()=>{let t=S.templates.find(x=>x.id===sel.value);if(!t)return;document.getElementById('woTitle').value=t.title||'';document.getElementById('woDescription').value=t.description||'';document.getElementById('woType').value=t.work_order_type||'corrective';document.getElementById('woPriority').value=t.priority||'medium';document.getElementById('woEstimated').value=t.estimated_minutes??'';document.getElementById('woCategory').value=t.category||'';document.getElementById('woTeam').value=t.team_id||'';refreshWoTechnicians(t.technician_id||'');document.getElementById('woBefore').checked=!!t.photos_before_required;document.getElementById('woAfter').checked=!!t.photos_after_required;document.getElementById('woSignature').checked=!!t.signature_required})}
function templates(){if(!isMgr()){S.page='workorders';return render()}shell(`<div class="row mobileStack"><div><h1 class="title">Modèles d’OT</h1><p class="sub">Standardiser les interventions récurrentes</p></div></div><div class="grid2"><div class="card"><h3>Nouveau modèle</h3><form id="newTemplate"><div class="field"><label>Nom du modèle *</label><input name="name" required placeholder="Ex: Révision compresseur"></div><div class="field"><label>Titre OT *</label><input name="title" required placeholder="Ex: Révision périodique compresseur"></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="grid2"><div class="field"><label>Type</label><select name="work_order_type"><option value="corrective">Correctif</option><option value="preventive">Préventif</option><option value="inspection">Inspection</option><option value="improvement">Amélioration</option><option value="emergency">Urgence</option></select></div><div class="field"><label>Priorité</label><select name="priority"><option value="low">Basse</option><option value="medium" selected>Moyenne</option><option value="high">Haute</option><option value="urgent">Urgente</option></select></div></div><div class="grid2"><div class="field"><label>Durée estimée (min)</label><input name="estimated_minutes" type="number" min="0"></div><div class="field"><label>Catégorie</label><input name="category"></div></div><div class="field"><label>Procédure / checklist</label><select name="procedure_id"><option value="">Aucune</option>${S.procedures.filter(p=>p.status==='published').map(p=>`<option value="${p.id}">${e(p.name)} v${e(p.version)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Équipe</label><select name="team_id" id="tplTeam"><option value="">Aucune</option>${S.teams.map(t=>`<option value="${t.id}">${e(t.name)}</option>`).join('')}</select></div><div class="field"><label>Technicien</label><select name="technician_id" id="tplTech"><option value="">Aucun</option>${S.profiles.filter(p=>['technician','supervisor','manager','admin'].includes(p.role)).map(p=>`<option value="${p.id}">${e(p.full_name)}</option>`).join('')}</select></div></div><div class="stack"><label><input type="checkbox" name="photos_before_required"> Photo avant</label><label><input type="checkbox" name="photos_after_required"> Photo après</label><label><input type="checkbox" name="signature_required"> Signature</label></div><button class="btn primary" style="margin-top:12px">Créer le modèle</button></form></div><div class="card"><h3>Modèles actifs</h3>${S.templates.map(t=>`<div class="listitem"><div class="row mobileStack"><div><b>${e(t.name)}</b><div class="mut">${e(t.title)} · ${e(t.work_order_type)} · ${e(t.priority)}${t.estimated_minutes?' · '+e(t.estimated_minutes)+' min':''}</div><div class="stack" style="margin-top:6px">${t.photos_before_required?'<span class="pill">Photo avant</span>':''}${t.photos_after_required?'<span class="pill">Photo après</span>':''}${t.signature_required?'<span class="pill">Signature</span>':''}</div></div><button class="btn primary" data-use-template="${t.id}">Utiliser</button></div></div>`).join('')||'<div class="mut">Aucun modèle.</div>'}</div></div>`)}

function procedureTypeLabel(t){return({check:'Check',text:'Texte',number:'Nombre',pass_fail:'Pass / Fail',photo:'Photo',meter:'Compteur',signature:'Signature'})[t]||t}
function procedures(){if(!isMgr()){S.page='workorders';return render()}let arr=[...S.procedures].sort((a,b)=>a.name.localeCompare(b.name)||b.version-a.version);shell(`<div class="row mobileStack"><div><h1 class="title">Procédures</h1><p class="sub">Créer des checklists versionnées pour les interventions</p></div></div><div class="grid2"><div class="card"><h3>Nouvelle procédure</h3><form id="newProcedure"><div class="field"><label>Nom *</label><input name="name" required placeholder="Ex: Contrôle quotidien compresseur"></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="grid2"><div class="field"><label>Catégorie</label><input name="category" placeholder="Inspection, sécurité…"></div><div class="field"><label>Durée estimée (min)</label><input name="estimated_minutes" type="number" min="0"></div></div><div class="field"><label>Consignes sécurité</label><textarea name="safety_notes"></textarea></div><label><input type="checkbox" name="scoring_enabled"> Calculer un score</label><button class="btn primary" style="margin-top:12px">Créer le brouillon</button></form></div><div class="card"><h3>Bibliothèque</h3>${arr.map(p=>{let n=S.steps.filter(s=>s.procedure_id===p.id).length;return `<div class="listitem"><div class="row mobileStack"><div><b>${e(p.name)} · v${e(p.version)}</b><div class="mut">${e(p.category||'Sans catégorie')} · ${n} étape(s) · ${e(p.estimated_minutes||'—')} min</div></div><div class="stack">${pill(p.status)}<button class="btn" data-openprocedure="${p.id}">Ouvrir</button></div></div></div>`}).join('')||'<div class="mut">Aucune procédure.</div>'}</div></div>`)}
function procedureStepForm(p){let st=S.editStepId?S.steps.find(x=>x.id===S.editStepId&&x.procedure_id===p.id):null;return `<div class="card"><div class="row"><h3>${st?'Modifier':'Ajouter'} une étape</h3>${st?'<button class="btn" type="button" data-a="cancelstepedit">Annuler</button>':''}</div><form id="procedureStep"><input type="hidden" name="step_id" value="${e(st?.id||'')}"><div class="field"><label>Titre *</label><input name="title" required value="${e(st?.title||'')}"></div><div class="field"><label>Instructions</label><textarea name="instructions">${e(st?.instructions||'')}</textarea></div><div class="grid2"><div class="field"><label>Type</label><select name="step_type" id="builderStepType">${['check','text','number','pass_fail','photo','meter','signature'].map(t=>`<option value="${t}" ${st?.step_type===t?'selected':''}>${procedureTypeLabel(t)}</option>`).join('')}</select></div><div class="field"><label>Obligatoire</label><select name="required"><option value="false" ${!st?.required?'selected':''}>Non</option><option value="true" ${st?.required?'selected':''}>Oui</option></select></div></div><div class="grid3"><div class="field"><label>Minimum</label><input name="min_value" type="number" step="any" value="${e(st?.min_value??'')}"></div><div class="field"><label>Maximum</label><input name="max_value" type="number" step="any" value="${e(st?.max_value??'')}"></div><div class="field"><label>Unité</label><input name="unit" value="${e(st?.unit||'')}"></div></div><div class="field"><label>Compteur Mainteno (pour type Compteur)</label><select name="meter_id"><option value="">Aucun</option>${S.meters.map(m=>`<option value="${m.id}" ${st?.meter_id===m.id?'selected':''}>${e(m.name)} · ${e(m.unit)}</option>`).join('')}</select></div><div class="field"><label>Action corrective / message d’anomalie</label><textarea name="corrective_action">${e(st?.corrective_action||'')}</textarea></div><button class="btn primary">${st?'Enregistrer':'Ajouter l’étape'}</button></form></div>`}
function procedureDetail(){if(!isMgr()){S.page='workorders';return render()}let p=S.procedures.find(x=>x.id===S.selected);if(!p){S.page='procedures';return render()}let ss=S.steps.filter(x=>x.procedure_id===p.id).sort((a,b)=>a.position-b.position),draft=p.status==='draft';shell(`<button class="btn" data-p="procedures">← Procédures</button><div class="card"><div class="row mobileStack"><div><div class="mut">Version ${e(p.version)}</div><h1 class="title">${e(p.name)}</h1><p class="sub">${e(p.description||'')}</p></div><div class="stack">${pill(p.status)}${draft?'<button class="btn success" data-publishprocedure="'+p.id+'">Publier</button>':'<button class="btn primary" data-cloneprocedure="'+p.id+'">Créer version suivante</button>'}</div></div>${draft?`<form id="procedureMeta" style="margin-top:12px"><div class="grid2"><div class="field"><label>Nom</label><input name="name" required value="${e(p.name)}"></div><div class="field"><label>Catégorie</label><input name="category" value="${e(p.category||'')}"></div></div><div class="field"><label>Description</label><textarea name="description">${e(p.description||'')}</textarea></div><div class="grid2"><div class="field"><label>Durée estimée (min)</label><input name="estimated_minutes" type="number" min="0" value="${e(p.estimated_minutes??'')}"></div><div class="field"><label>Score</label><select name="scoring_enabled"><option value="false" ${!p.scoring_enabled?'selected':''}>Désactivé</option><option value="true" ${p.scoring_enabled?'selected':''}>Activé</option></select></div></div><div class="field"><label>Consignes sécurité</label><textarea name="safety_notes">${e(p.safety_notes||'')}</textarea></div><button class="btn">Enregistrer les informations</button></form>`:`${metric('Catégorie',p.category||'—')}${metric('Durée estimée',(p.estimated_minutes??'—')+' min')}${metric('Sécurité',p.safety_notes||'—')}`}</div><div class="card"><h3>Étapes (${ss.length})</h3>${ss.map(st=>`<div class="listitem"><div class="row mobileStack"><div><b>${st.position}. ${e(st.title)}</b><div class="mut">${procedureTypeLabel(st.step_type)}${st.required?' · obligatoire':''}${st.unit?' · '+e(st.unit):''}${st.min_value!=null||st.max_value!=null?' · ['+e(st.min_value??'—')+' → '+e(st.max_value??'—')+']':''}</div>${st.instructions?`<div>${e(st.instructions)}</div>`:''}</div>${draft?`<div class="stack"><button class="btn" data-movestep="up" data-stepid="${st.id}">↑</button><button class="btn" data-movestep="down" data-stepid="${st.id}">↓</button><button class="btn" data-editstep="${st.id}">Modifier</button><button class="btn danger" data-delstep="${st.id}">Supprimer</button></div>`:''}</div></div>`).join('')||'<div class="mut">Aucune étape.</div>'}</div>${draft?procedureStepForm(p):''}`)}


function rel(w){return{parts:S.woParts.filter(x=>x.work_order_id===w.id),atts:S.atts.filter(x=>x.entity_type==='work_order'&&x.entity_id===w.id),runs:S.runs.filter(x=>x.work_order_id===w.id)}}
function draftFor(id){return S.drafts.find(d=>d.work_order_id===id)?.draft||JSON.parse(localStorage.getItem('draft_'+id)||'{}')}
function woDetail(){let w=S.wo.find(x=>x.id===S.selected);if(!w){S.page='workorders';return render()}let r=rel(w),a=S.assets.find(x=>x.id===w.asset_id),d=draftFor(w.id),closed=['completed','validated','cancelled'].includes(w.status);shell(`<button class="btn" data-p="workorders">← OT</button><div class="card"><div class="row mobileStack"><div><div class="mut">OT #${w.wo_number}</div><h1 class="title">${e(w.title)}</h1><p class="sub">${e(a?.code||'Sans machine')}</p></div>${pill(w.status)}</div><div class="stack" style="margin-top:10px">${!w.started_at&&!closed?'<button class="btn success" data-a="startwo">▶ Démarrer</button>':''}${w.status==='in_progress'?'<button class="btn warn" data-a="holdwo">⏸ Attente</button>':''}${w.status==='on_hold'?'<button class="btn success" data-a="resumewo">▶ Reprendre</button>':''}${isMgr()&&w.status==='completed'?'<button class="btn success" data-a="validatewo">✓ Valider</button><button class="btn danger" data-a="reopenwo">↩ Renvoyer</button>':''}</div></div>${isMgr()?`<div class="card"><h3>Affectation</h3>${metric('Équipe',S.teams.find(t=>t.id===w.team_id)?.name||'—')}${metric('Technicien',S.profiles.find(p=>p.id===w.technician_id)?.full_name||'—')}${metric('Échéance',w.due_at?new Date(w.due_at).toLocaleString('fr-FR'):'—')}<button class="btn primary" data-a="assignwo">Modifier l’affectation</button></div>`:''}${!closed?`<div class="photoGrid"><div class="card cameraBox"><h3>Avant</h3><div class="mut">${r.atts.filter(x=>x.kind==='before').length} photo(s)</div><input id="beforeFile" type="file" accept="image/*" capture="environment" hidden><button class="btn primary" data-a="beforephoto">📷 Photo</button></div><div class="card cameraBox"><h3>Après</h3><div class="mut">${r.atts.filter(x=>x.kind==='after').length} photo(s)</div><input id="afterFile" type="file" accept="image/*" capture="environment" hidden><button class="btn primary" data-a="afterphoto">📷 Photo</button></div></div>`:''}${!closed?partsSection(w,r.parts):''}${procedureExceptions(w)}${!closed?procedureSection(r.runs):''}${w.started_at&&!closed?closeForm(w,d):''}${closed?`<div class="card"><h3>Compte-rendu</h3>${metric('Diagnostic',w.diagnosis||'—')}${metric('Travail',w.work_performed||'—')}${metric('Temps actif',w.labor_hours+' h')}${metric('Temps total',w.duration_hours+' h')}</div>`:''}`);if(!closed)setTimeout(()=>bindDraft(w.id),50)}

function partsSection(w,lines){return `<div class="card"><h3>Pièces utilisées</h3>${lines.map(l=>{let p=S.parts.find(x=>x.id===l.part_id);return `<div class="listitem"><b>${e(p?.reference||'')} · ${e(p?.name||'Pièce')}</b><div class="mut">Qté ${l.quantity}</div></div>`}).join('')||'<div class="mut">Aucune pièce.</div>'}<div class="grid2"><select id="partSelect"><option value="">Choisir</option>${S.parts.filter(p=>Number(p.quantity_on_hand)>0).map(p=>`<option value="${p.id}">${e(p.reference||'')} · ${e(p.name)} (${p.quantity_on_hand})</option>`).join('')}</select><input id="partQty" type="number" min="0.01" step="0.01" value="1"></div><div class="stack" style="margin-top:10px"><button class="btn primary" data-a="addpart">+ Ajouter</button><label><input id="noParts" type="checkbox" ${w.no_parts_used?'checked':''}> Aucune pièce</label></div></div>`}
function stepControl(st,run,rr){let dis=run.completed_at?'disabled':'';let saved=rr?.completed_at?'<span class="pill green">Enregistré</span>':'';let lim=(st.min_value!=null||st.max_value!=null)?`<div class="mut">Plage: ${st.min_value??'—'} à ${st.max_value??'—'} ${e(st.unit||'')}</div>`:'';if(st.step_type==='check'||st.step_type==='pass_fail')return `<div class="field"><label>${e(st.title)}${st.required?' *':''} ${saved}</label>${st.instructions?`<div class="mut">${e(st.instructions)}</div>`:''}<select data-step-control="${st.id}" data-run="${run.id}" data-type="${st.step_type}" ${dis}><option value="">Choisir</option><option value="true" ${rr?.result_bool===true?'selected':''}>${st.step_type==='check'?'Oui / conforme':'PASS'}</option><option value="false" ${rr?.result_bool===false?'selected':''}>${st.step_type==='check'?'Non / anomalie':'FAIL'}</option></select>${rr?.outcome==='fail'?'<div class="notice">Échec enregistré</div>':''}</div>`;if(st.step_type==='text')return `<div class="field"><label>${e(st.title)}${st.required?' *':''} ${saved}</label><input data-step-control="${st.id}" data-run="${run.id}" data-type="text" value="${e(rr?.result_text||'')}" ${dis}></div>`;if(st.step_type==='number'||st.step_type==='meter')return `<div class="field"><label>${e(st.title)}${st.required?' *':''} ${saved}</label>${lim}<div class="row"><input type="number" step="any" data-step-control="${st.id}" data-run="${run.id}" data-type="${st.step_type}" value="${rr?.result_number??''}" ${dis}><span>${e(st.unit||'')}</span></div>${rr?.within_limits===false?'<div class="notice">Valeur hors tolérance</div>':''}</div>`;if(st.step_type==='photo')return `<div class="field"><label>${e(st.title)}${st.required?' *':''} ${saved}</label><input id="stepfile-${st.id}" type="file" accept="image/*" capture="environment" hidden><button class="btn primary" data-stepphoto="${st.id}" data-run="${run.id}" ${dis}>📷 ${rr?.photo_path?'Remplacer photo':'Prendre photo'}</button></div>`;if(st.step_type==='signature')return `<div class="field"><label>${e(st.title)}${st.required?' *':''} ${saved}</label><button class="btn primary" data-stepsign="${st.id}" data-run="${run.id}" ${dis}>✍ ${rr?.signature_path?'Refaire signature':'Signer'}</button></div>`;return `<div class="mut">Type ${e(st.step_type)} non pris en charge</div>`}
function procedureSection(runs){return `<div class="card"><h3>Checklist / procédure</h3>${runs.map(run=>{let p=S.procedures.find(x=>x.id===run.procedure_id),steps=S.steps.filter(x=>x.procedure_id===run.procedure_id),res=S.results.filter(x=>x.run_id===run.id);return `<div class="card"><div class="row"><div><b>${e(p?.name||'Procédure')}</b><div class="mut">${run.score!=null?'Score '+run.score+'%':''}</div></div>${pill(run.completed_at?'completed':'in_progress')}</div>${steps.map(st=>stepControl(st,run,res.find(x=>x.step_id===st.id))).join('')}${!run.completed_at?`<button class="btn success" data-runcomplete="${run.id}">Terminer la procédure</button>`:''}</div>`}).join('')||'<div class="mut">Aucune checklist.</div>'}</div>`}
function procedureExceptions(w){let xs=S.exceptions.filter(x=>x.work_order_id===w.id&&x.status!=='resolved');if(!xs.length&&!w.procedure_review_required)return '';return `<div class="card"><div class="row"><h3>Anomalies procédure</h3><span class="pill red">${xs.length} ouverte(s)</span></div>${xs.map(x=>`<div class="listitem"><b>${e(x.message)}</b><div class="mut">${e(x.exception_type)} · ${e(x.status)}</div>${isMgr()?`<button class="btn success" data-resolveexception="${x.id}">Résoudre</button>`:''}</div>`).join('')}</div>`}
function closeForm(w,d){return `<form id="closeWO" class="card"><div class="row"><h3>Compte-rendu</h3><span class="mut" id="draftState">Brouillon auto</span></div><div class="field"><label>Diagnostic *</label><textarea name="diagnosis" required>${e(d.diagnosis||'')}</textarea></div><div class="field"><label>Cause racine</label><textarea name="root_cause">${e(d.root_cause||'')}</textarea></div><div class="field"><label>Travail réalisé *</label><textarea name="work_performed" required>${e(d.work_performed||'')}</textarea></div><div class="grid2"><div class="field"><label>Résultat</label><select name="resolution_status"><option value="repaired">Réparée</option><option value="temporary_repair">Réparation provisoire</option><option value="monitoring">Surveillance</option><option value="not_repaired">Non réparée</option></select></div><div class="field"><label>État machine</label><select name="asset_status_after"><option value="online">En ligne</option><option value="limited">Limitée</option><option value="offline">À l'arrêt</option></select></div></div><div class="field"><label>Downtime (h)</label><input name="downtime_hours" type="number" min="0" step="0.01" value="${e(d.downtime_hours||0)}"></div><label class="check"><input name="functional_test_complete" type="checkbox" ${d.functional_test_complete?'checked':''}> Essai fonctionnel</label><label class="check"><input name="safety_check_complete" type="checkbox" ${d.safety_check_complete?'checked':''}> Contrôle sécurité</label><div class="field"><label>Commentaire</label><textarea name="technician_comment">${e(d.technician_comment||'')}</textarea></div><button class="btn success" style="width:100%">Terminer l’OT</button></form>`}
function requests(){let arr=isMgr()?S.requests:S.requests.filter(r=>r.requested_by===S.u.id);shell(`<div class="row mobileStack"><div><h1 class="title">Demandes d’intervention</h1><p class="sub">Signaler un besoin avant création d’un OT</p></div><div class="stack"><button class="btn primary" data-a="newrequest">+ Nouvelle demande</button>${isMgr()?'<button class="btn" data-a="newportal">+ Portail QR</button>':''}</div></div>${isMgr()&&S.portals.length?`<div class="card"><h3>Portails QR publics</h3>${S.portals.map(p=>`<div class="listitem"><div class="row mobileStack"><div><b>${e(p.name)}</b><div class="mut">${e(S.assets.find(a=>a.id===p.asset_id)?.code||'')} · ${e(S.locations.find(l=>l.id===p.location_id)?.path||'')}</div></div><button class="btn" data-copyportal="${p.token}">Copier lien</button></div></div>`).join('')}</div>`:''}<div class="card">${arr.map(r=>{let a=S.assets.find(x=>x.id===r.asset_id);return `<div class="listitem"><div class="row mobileStack"><div><b>${e(r.title)}</b><div class="mut">${e(a?.code||'Sans machine')} · ${e(r.priority)} · ${new Date(r.created_at).toLocaleString('fr-FR')}</div>${r.description?`<div class="mut">${e(r.description)}</div>`:''}${r.review_comment?`<div class="notice" style="margin-top:6px">${e(r.review_comment)}</div>`:''}</div><div class="stack">${pill(r.status)}${isMgr()&&r.status==='pending'?`<button class="btn success" data-convertrequest="${r.id}">Convertir OT</button><button class="btn danger" data-declinerequest="${r.id}">Refuser</button>`:''}</div></div></div>`}).join('')||'<div class="mut">Aucune demande.</div>'}</div>`)}
function planning(){let x=S.wo.filter(w=>w.due_at&&!['completed','validated','cancelled'].includes(w.status)).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at));shell(`<h1 class="title">Planning</h1><div class="card">${x.map(w=>`<div class="listitem" data-wo="${w.id}"><div class="row"><div><b>${new Date(w.due_at).toLocaleDateString('fr-FR')} · #${w.wo_number}</b><div class="mut">${e(w.title)}</div></div>${pill(w.status)}</div></div>`).join('')||'<div class="mut">Aucun OT planifié.</div>'}</div>`)}
function pm(){shell(`<h1 class="title">Maintenance préventive</h1><div class="card">${S.pm.map(p=>`<div class="listitem"><b>${e(p.name)}</b><div class="mut">${e(p.schedule_type)} · ${p.next_due_at?new Date(p.next_due_at).toLocaleString('fr-FR'):'déclenchement compteur'}</div></div>`).join('')||'<div class="mut">Aucun plan.</div>'}</div>`)}
function meters(){shell(`<h1 class="title">Compteurs</h1><div class="grid2">${S.meters.map(m=>`<div class="card"><b>${e(m.name)}</b><div class="mut">${e(m.current_value??'—')} ${e(m.unit||'')}</div></div>`).join('')||'<div class="mut">Aucun compteur.</div>'}</div>`)}
function inventory(){shell(`<div class="row mobileStack"><div><h1 class="title">Pièces & stock</h1><p class="sub">Quantités, seuils et valorisation</p></div>${isMgr()?'<div class="stack"><button class="btn" data-a="exportstock">Excel</button><button class="btn" data-a="printstock">PDF</button></div>':''}</div><div class="card"><table class="table"><tr><th>Réf.</th><th>Pièce</th><th>Stock</th><th>Mini</th><th>Coût</th></tr>${S.parts.map(p=>`<tr><td>${e(p.reference||'')}</td><td>${e(p.name)}</td><td>${p.quantity_on_hand}</td><td>${p.minimum_stock}</td><td>${Number(p.unit_cost_mad||0).toFixed(2)} MAD</td></tr>`).join('')}</table></div>`)}

function purchase(){shell(`<div class="row mobileStack"><div><h1 class="title">Achats</h1><p class="sub">Demandes, approbations et réceptions</p></div><button class="btn primary" data-a="newpo">+ Nouveau PO</button></div><div class="card">${S.pos.map(po=>{let v=S.vendors.find(x=>x.id===po.vendor_id);return `<div class="listitem" data-po="${po.id}"><div class="row"><div><b>PO #${po.po_number} · ${e(v?.name||'Sans fournisseur')}</b><div class="mut">${Number(po.total_mad||0).toFixed(2)} MAD · ${new Date(po.created_at).toLocaleDateString('fr-FR')}</div></div>${pill(po.status)}</div></div>`}).join('')||'<div class="mut">Aucun bon de commande.</div>'}</div>`)}
function purchaseDetail(){let po=S.pos.find(x=>x.id===S.selected);if(!po){S.page='purchase';return render()}let v=S.vendors.find(x=>x.id===po.vendor_id),lines=S.polines.filter(x=>x.purchase_order_id===po.id);shell(`<button class="btn" data-p="purchase">← Achats</button><div class="card"><div class="row mobileStack"><div><div class="mut">Bon de commande</div><h1 class="title">PO #${po.po_number}</h1><p class="sub">${e(v?.name||'Sans fournisseur')} · ${Number(po.total_mad||0).toFixed(2)} MAD</p></div><div class="stack">${pill(po.status)}${po.status==='requested'?'<button class="btn success" data-a="approvepo">Approuver</button>':''}</div></div></div><div class="card"><div class="row"><h3>Lignes</h3>${po.status==='requested'?'<button class="btn primary" data-a="addpoline">+ Ligne</button>':''}</div>${lines.map(l=>{let p=S.parts.find(x=>x.id===l.part_id),rest=Number(l.quantity_ordered)-Number(l.quantity_received);return `<div class="listitem"><div class="row mobileStack"><div><b>${e(p?.reference||'')} · ${e(l.description)}</b><div class="mut">Commandé ${l.quantity_ordered} · Reçu ${l.quantity_received} · ${Number(l.unit_cost_mad).toFixed(2)} MAD/u</div></div>${['approved','partially_fulfilled'].includes(po.status)&&rest>0?`<button class="btn success" data-receiveline="${l.id}" data-rest="${rest}">Réceptionner</button>`:''}</div></div>`}).join('')||'<div class="mut">Aucune ligne.</div>'}</div>`)}
function kpis(){shell(`<div class="row mobileStack"><div><h1 class="title">KPI</h1><p class="sub">30 derniers jours</p></div><div class="stack"><button class="btn" data-a="exportmkpi">Machines Excel</button><button class="btn" data-a="printmkpi">Machines PDF</button><button class="btn" data-a="exporttkpi">Équipe Excel</button><button class="btn" data-a="printtkpi">Équipe PDF</button></div></div><div class="notice">Les KPI techniciens sont des indicateurs opérationnels. Comparaison considérée exploitable à partir de 5 interventions terminées.</div><div class="grid2" style="margin-top:12px"><div class="card"><h3>Machines</h3>${S.machineKpis.slice(0,12).map(k=>`<div class="listitem" data-asset="${k.asset_id}"><b>${e(k.code)} · ${e(k.asset_name)}</b><div class="mut">MTTR ${k.mttr_hours??'N/A'} h · downtime ${k.downtime_hours} h · pièces ${k.parts_cost_mad} MAD</div></div>`).join('')}</div><div class="card"><h3>Équipe</h3>${S.techKpis.map(k=>`<div class="listitem"><b>${e(k.technician_name)}</b><div class="mut">${k.completed_work_orders} terminés · MTTR ${k.mttr_hours??'N/A'} · docs ${k.documentation_pct??'N/A'}% · ${k.comparison_ready?'échantillon suffisant':'échantillon insuffisant'}</div></div>`).join('')}</div></div>`)}
function notifications(){let unread=S.notifications.filter(n=>!n.read_at).length;shell(`<div class="row"><div><h1 class="title">Alertes</h1><p class="sub">${unread} non lue(s)</p></div>${unread?'<button class="btn" data-a="readall">Tout marquer lu</button>':''}</div><div class="card">${S.notifications.map(n=>`<div class="listitem" data-notif="${n.id}" data-entity="${n.entity_type||''}" data-entityid="${n.entity_id||''}" style="${n.read_at?'opacity:.6':''}"><b>${e(n.title)}</b><div class="mut">${e(n.body||'')} · ${new Date(n.created_at).toLocaleString('fr-FR')}</div></div>`).join('')||'<div class="mut">Aucune alerte.</div>'}</div>`)}

function audit(){shell(`<h1 class="title">Audit</h1><div class="card">${S.audit.map(a=>{let u=S.profiles.find(x=>x.id===a.user_id);return `<div class="listitem"><b>${e(a.entity_type)} · ${e(a.action)}</b><div class="mut">${e(u?.full_name||'Système')} · ${new Date(a.created_at).toLocaleString('fr-FR')}</div></div>`}).join('')||'<div class="mut">Aucune trace.</div>'}</div>`)}
function organization(){if(!isMgr()){S.page='workorders';return render()}shell(`<div class="row mobileStack"><div><h1 class="title">Organisation</h1><p class="sub">Sites, zones, emplacements et équipes</p></div><div class="stack"><button class="btn primary" data-a="newsite">+ Site</button><button class="btn" data-a="newzone">+ Zone</button><button class="btn" data-a="newlocation">+ Emplacement</button><button class="btn primary" data-a="newteam">+ Équipe</button></div></div><div class="grid2" style="margin-top:12px"><div class="card"><h3>Arborescence</h3>${S.locations.map(l=>`<div class="listitem"><div style="padding-left:${Math.min(l.depth,5)*18}px"><b>${e(l.path)}</b><div class="mut">${e(l.location_type)}${l.code?' · '+e(l.code):''}</div></div></div>`).join('')||'<div class="mut">Aucun emplacement.</div>'}</div><div class="card"><h3>Équipes</h3>${S.teams.map(t=>{let ms=S.teamMembers.filter(m=>m.team_id===t.id);return `<div class="listitem"><div class="row mobileStack"><div><b>${e(t.name)}</b><div class="mut">${e(t.description||'')} · ${ms.length} membre(s)</div>${ms.map(m=>{let p=S.profiles.find(x=>x.id===m.user_id);return `<span class="pill ${m.is_lead?'blue':''}">${e(p?.full_name||m.user_id)}${m.is_lead?' · lead':''}</span>`}).join(' ')}</div><div class="stack"><button class="btn" data-addmember="${t.id}">+ Membre</button></div></div></div>`}).join('')||'<div class="mut">Aucune équipe.</div>'}</div></div>`)}
function diagnostic(){if(!isMgr()){S.page='workorders';return render()}let h=S.health,checks=h?.checks||[];shell(`<div class="row mobileStack"><div><h1 class="title">Diagnostic Mainteno</h1><p class="sub">Contrôle lecture seule des fonctions critiques</p></div><button class="btn primary" data-a="refreshdiag">↻ Relancer</button></div><div class="card"><div class="row"><div><b>État général</b><div class="mut">Dernier contrôle : ${h?.checked_at?new Date(h.checked_at).toLocaleString('fr-FR'):'—'}</div></div>${h?.overall_ok===true?'<span class="pill green">OPÉRATIONNEL</span>':'<span class="pill red">ANOMALIE</span>'}</div></div><div class="card">${checks.map(c=>`<div class="healthRow"><div class="healthIcon ${c.ok?'ok':'bad'}">${c.ok?'✓':'!'}</div><div><b>${e(c.label)}</b><div class="mut">${c.schedule?'Planification '+e(c.schedule):c.count!=null?'Valeur : '+e(c.count):e(c.key)}</div></div>${c.ok?'<span class="pill green">OK</span>':'<span class="pill red">À vérifier</span>'}</div>`).join('')||'<div class="mut">Diagnostic indisponible.</div>'}</div>`)}
function more(){if(!isMgr()){S.page='profile';return render()}let items=managerNav().filter(x=>!['dashboard','assets','workorders','notifications'].includes(x[0]));shell(`<h1 class="title">Plus</h1><p class="sub">Tous les modules Responsable</p><div class="moreGrid" style="margin-top:14px">${items.map(x=>`<button class="card" data-p="${x[0]}"><b>${x[2]} ${x[1]}</b></button>`).join('')}</div>`)}
function profile(){shell(`<div class="card"><h1 class="title">${e(S.p.full_name)}</h1><p class="sub">${e(S.p.role)} · ${e(S.p.department||'')}</p><div class="notice" style="margin-top:12px">Mainteno peut être installé comme une application sur le téléphone.</div>${installPrompt?'<button class="btn primary" style="margin-top:12px" data-a="installapp">Installer Mainteno</button>':'<div class="mut" style="margin-top:10px">Si le bouton n’apparaît pas, utilise le menu du navigateur → Ajouter à l’écran d’accueil.</div>'}</div>`)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('mainteno-next',2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('queue'))d.createObjectStore('queue',{keyPath:'id'});if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(store,obj){let d=await openDB();return new Promise((res,rej)=>{let tx=d.transaction(store,'readwrite');tx.objectStore(store).put(obj);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbAll(store){let d=await openDB();return new Promise((res,rej)=>{let r=d.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDel(store,id){let d=await openDB();return new Promise((res,rej)=>{let tx=d.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function enqueue(type,entity,payload={},blob=null){let id=crypto.randomUUID(),at=new Date().toISOString();await idbPut('queue',{id,type,entity,payload,at,status:'pending'});if(blob)await idbPut('files',{id,blob});showSync();return id}
async function queueOrRun(type,entity,payload={},eventAt=new Date().toISOString()){if(!navigator.onLine){await enqueue(type,entity,payload);toast('Action enregistrée hors ligne');return{queued:true}}let r=await rpc('nx_sync_mobile_action',{p_action_id:crypto.randomUUID(),p_action_type:type,p_entity_id:entity,p_payload:payload,p_event_at:eventAt});if(r.status==='failed')throw Error(r.error||'Synchronisation refusée');return r}

async function showSync(){let q=await idbAll('queue').catch(()=>[]),bad=q.filter(x=>x.status==='conflict').length;S.syncQueue=q;if(!q.length){SYNC.hidden=true;SYNC.textContent='';return}SYNC.hidden=false;SYNC.className='syncbar'+(bad?' err':'');SYNC.textContent=bad?`${bad} conflit(s) · ${q.length} action(s) en attente · toucher pour ouvrir`:`${q.length} action(s) à synchroniser`}

 class="btn success" style="width:100%">Terminer l’OT</button></form>`}
function openWoSignature(){let wrap=document.createElement('div');wrap.className='scanWrap';wrap.innerHTML=`<div class="scanBox"><h3>Signature OT</h3><canvas id="woSigCanvas" width="800" height="280" style="width:100%;height:180px;border:1px solid #d1d5db;border-radius:10px;touch-action:none;background:white"></canvas><div class="stack" style="margin-top:10px"><button class="btn" id="woSigClear">Effacer</button><button class="btn success" id="woSigSave">Enregistrer</button><button class="btn danger" id="woSigCancel">Annuler</button></div></div>`;document.body.appendChild(wrap);let c=wrap.querySelector('#woSigCanvas'),ctx=c.getContext('2d'),draw=false,last=null;ctx.lineWidth=4;ctx.lineCap='round';const pos=ev=>{let r=c.getBoundingClientRect();return{x:(ev.clientX-r.left)*c.width/r.width,y:(ev.clientY-r.top)*c.height/r.height}};c.onpointerdown=ev=>{draw=true;last=pos(ev);ev.preventDefault()};c.onpointermove=ev=>{if(!draw)return;let q=pos(ev);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;ev.preventDefault()};c.onpointerup=c.onpointerleave=()=>draw=false;wrap.querySelector('#woSigClear').onclick=()=>ctx.clearRect(0,0,c.width,c.height);wrap.querySelector('#woSigCancel').onclick=()=>wrap.remove();wrap.querySelector('#woSigSave').onclick=()=>c.toBlob(async blob=>{try{let f=new File([blob],'signature.png',{type:'image/png'});wrap.remove();if(navigator.onLine){let id=crypto.randomUUID(),path=`work-orders/${S.selected}/signature-${Date.now()}-${id}.png`;let rr=await fetch(SB+'/storage/v1/object/mainteno-next-media/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+S.s.access_token,'Content-Type':'image/png','x-upsert':'false'},body:f});if(!rr.ok)throw Error('Échec upload signature');let sr=await rpc('nx_sync_mobile_action',{p_action_id:id,p_action_type:'photo_attachment',p_entity_id:S.selected,p_payload:{storage_path:path,kind:'signature',mime_type:'image/png',caption:'Signature OT'},p_event_at:new Date().toISOString()});if(sr.status==='failed')throw Error(sr.error);await loadAll();render();toast('Signature enregistrée')}else{await enqueue('photo_upload',S.selected,{kind:'signature',mime:'image/png',caption:'Signature OT',ext:'png'},f);toast('Signature gardée hors ligne')}}catch(x){toast(x.message,1)}},'image/png')}

function fillTechnicianSelect(selectId,teamId,emptyLabel='Aucun'){
  let el=document.getElementById(selectId);if(!el)return;
  let current=el.value,techs=activeTechs();
  if(teamId)techs=S.teamMembers.filter(m=>m.team_id===teamId).map(m=>S.profiles.find(p=>p.id===m.user_id)).filter(Boolean);
  el.innerHTML=`<option value="">${emptyLabel}</option>`+techs.map(p=>`<option value="${p.id}">${e(p.full_name)} · ${e(p.role)}</option>`).join('');
  if(techs.some(p=>p.id===current))el.value=current;
}
